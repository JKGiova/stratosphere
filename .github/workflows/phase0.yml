name: phase0
on:
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
          python-version: "3.14.7"
      - run: uv sync --locked --extra engine --no-build-package nautilus-trader
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync python -m stratosphere.phase0.compatibility --require-engine --output reports/compatibility.json
      - run: uv run --no-sync pytest -m 'not engine'
      - run: uv run --no-sync python -m stratosphere.phase0.data_proof --fetch
      - run: uv run --no-sync pytest -m engine
        env:
          STRATOSPHERE_REQUIRE_ENGINE: "1"
      - run: uv run --no-sync python -m stratosphere.phase0.engine_proof
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: phase0-${{ matrix.os }}
          path: reports/
