[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stratosphere"
version = "0.0.1"
description = "Online terminal research client with reproducible NautilusTrader backtests"
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpx==0.28.1",
  "keyring==25.7.0",
  "langgraph==1.2.15",
  "pydantic==2.14.1",
  "textual==8.2.8",
]

[project.optional-dependencies]
engine = ["nautilus_trader==1.231.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["engine: requires the pinned NautilusTrader binary"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/stratosphere"]
