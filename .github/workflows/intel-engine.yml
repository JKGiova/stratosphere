name: intel-engine
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/intel-engine.yml'
      - 'scripts/build-intel-engine.sh'
      - 'scripts/inspect_intel_wheel.py'
      - 'src/**'
      - 'tests/**'
      - 'uv.lock'
      - 'pyproject.toml'
permissions:
  contents: read
jobs:
  native-intel:
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.33'
          python-version: '3.14.7'
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build pinned native Intel wheel
        run: bash scripts/build-intel-engine.sh "$RUNNER_TEMP/intel-engine" "$(uv python find 3.14.7)"
      - name: Inspect native architecture and retain provenance
        run: |
          uv python find 3.14.7 > "$RUNNER_TEMP/intel-python-path"
          "$(cat "$RUNNER_TEMP/intel-python-path")" scripts/inspect_intel_wheel.py \
            "$RUNNER_TEMP"/intel-engine/wheels/*.whl \
            --source "$RUNNER_TEMP/intel-engine/source" \
            --output "$RUNNER_TEMP/intel-engine/wheels/provenance.json"
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.0'
          python-version: '3.14.7'
      - name: Install locked dependencies and native wheel in clean environment
        run: |
          uv export --quiet --locked --extra engine --no-emit-project --no-emit-package nautilus-trader \
            --output-file "$RUNNER_TEMP/intel-requirements.txt"
          uv venv --python 3.14.7 .venv
          uv pip sync --python .venv/bin/python --require-hashes "$RUNNER_TEMP/intel-requirements.txt"
          uv pip install --python .venv/bin/python --no-deps "$RUNNER_TEMP"/intel-engine/wheels/*.whl
          uv pip install --python .venv/bin/python --no-deps --editable .
          uv pip check --python .venv/bin/python
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/python -m stratosphere.phase0.compatibility --require-engine --output reports/intel-compatibility.json
      - run: .venv/bin/pytest
        env:
          STRATOSPHERE_REQUIRE_ENGINE: '1'
      - run: .venv/bin/python -m stratosphere.phase0.data_proof --fetch
      - run: .venv/bin/python -m stratosphere.phase0.engine_proof
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: intel-native-engine
          path: |
            ${{ runner.temp }}/intel-engine/wheels/
            reports/
